name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Test
        # No GEMINI_API_KEY here on purpose: the suite is fully offline (FakeLLM).
        run: pytest

      - name: Evaluation
        # Fails the build if skill-extraction F1 on the synthetic samples drops below 0.90, or if
        # the v2 layers stop separating the strong resumes from the weak/messy ones.
        run: python scripts/run_eval.py --min-f1 0.90
